<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Tokens and Typography</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Design Tokens & Typography</h1>
        <p>A simple CSS design system demonstration</p>
    </header>

    <main>

        <section>
            <h2>Color Design Tokens</h2>
            <div class="color-box">
                <div class="primary">Primary Color</div>
                <div class="secondary">Secondary Color</div>
                <div class="accent">Accent Color</div>
            </div>
        </section>

        <section>
            <h2>Typography System</h2>
            <h1>Heading 1</h1>
            <h2>Heading 2</h2>
            <h3>Heading 3</h3>
            <p>This is a paragraph demonstrating the body text style.</p>
            <small>This is small text.</small>
        </section>

        <section>
            <h2>Buttons</h2>
            <button class="primary-btn">Primary Button</button>
            <button class="secondary-btn">Secondary Button</button>
        </section>

    </main>

    <footer>
        <p>©️ 2026 CSS Design System</p>
    </footer>

</body>
</html>
